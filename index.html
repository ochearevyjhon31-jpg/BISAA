<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top, #1a0023, #000);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* Center */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 2;
}

h1 {
    font-size: 2.5rem;
    color: #ff4fd8;
    text-shadow: 0 0 10px #ff4fd8, 0 0 20px #ff00ff;
    margin-bottom: 10px;
}

p {
    font-size: 1.2rem;
    opacity: 0.9;
    margin-top: 0;
    margin-bottom: 20px;
}

/* Image Styling */
.profile-img {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ff4fd8;
    box-shadow: 0 0 15px #ff4fd8, 0 0 25px #ff00ff;
    margin-bottom: 15px;
}

/* Button */
button {
    margin: 10px 5px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #ff4fd8;
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 15px #ff4fd8;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #ff4fd8;
}

/* Hidden dynamic elements */
#btn-mwa {
    display: none;
}

#secret {
    display: none;
    margin-top: 20px;
    font-size: 1.1rem;
    color: #fff;
    animation: fadeIn 1s ease-in-out;
    line-height: 1.6;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Signature */
.signature {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1rem;
    opacity: 0.8;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4fd8; }
    to { text-shadow: 0 0 20px #ff00ff; }
}

/* Canvas */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}

/* Nakatagong YouTube Player */
#yt-player {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">
    <!-- Image ni Nicole -->
    <img src="nicole 2.jpg" alt="Nicole" class="profile-img">

    <h1>🎉 Happy Birthdayyy Nicole sweetieee !!!! 🎂</h1>
    <p>You deserve all the happiness in the world 💖✨</p>

    <!-- Dito ang kontrol ng mga Buttons -->
    <div class="button-group">
        <button id="btn-surprise" onclick="firstClick()">💖 Click for a surprise</button>
        <button id="btn-mwa" onclick="revealEverything()">file mwa 😘</button>
    </div>

    <!-- Mensahe na lalabas sa huli -->
    <div id="secret">
        I hope your day is as beautiful as your smile ✨<br>
        Stay happy always 💕 You’re appreciated more than you know.
    </div>

    <!-- Bagong-bago at tamang YouTube video ID para sa kanta mo -->
    <iframe id="yt-player" 
            src="https://www.youtube.com/embed/HuJOVEaOrmw?enablejsapi=1&autoplay=0&loop=1" 
            allow="autoplay">
    </iframe>
</div>

<div class="signature">
    Made with 💖 by Revy 💌
</div>

<canvas id="fireworks"></canvas>

<script>
// Unang click: Itatago ang unang button, lalabas ang "file mwa"
function firstClick() {
    document.getElementById("btn-surprise").style.display = "none";
    document.getElementById("btn-mwa").style.display = "inline-block";
}

// Pangalawang click: Lalabas ang message, fireworks, at tutugtog ang kanta sa background
function revealEverything() {
    document.getElementById("btn-mwa").style.display = "none";
    document.getElementById("secret").style.display = "block";
    
    // Utos para patugtugin ang bagong YouTube Video
    const iframe = document.getElementById("yt-player");
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    
    // Sisimulan ang fireworks display
    setInterval(firework, 900);
    animate();
}

/* Fireworks Animation Logic */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

let particles = [];

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 8;
        this.speedY = (Math.random() - 0.5) * 8;
        this.alpha = 1;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function firework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height / 2;
    const colors = ["#ff4fd8", "#00ffff", "#ffff00", "#ff6b6b", "#a66bff"];

    for (let i = 0; i < 70; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);
</script>

</body>
</html>
