<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #180028 0%, #080010 70%, #020005 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: white;
}

/* Screen Gatekeeper Button */
#gatekeeper {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #080010;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Base Layout Container */
.intro-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    text-align: center;
    width: 100%;
    pointer-events: none;
    display: none;
}

/* Exact Chandelier Style from image_f0f750.jpg */
.chandelier-container {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 220px;
    z-index: 95;
    pointer-events: none;
    display: none;
}

.chandelier-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 15px rgba(255, 70, 210, 0.95)) drop-shadow(0 0 30px rgba(255, 0, 180, 0.6));
    animation: elegantSway 5s ease-in-out infinite alternate;
    transform-origin: top center;
}

@keyframes elegantSway {
    from { transform: rotate(-1deg); }
    to { transform: rotate(1deg); }
}

/* Target Profile Frame Positioned precisely */
.intro-profile-img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 3.5px solid #ff55d0;
    box-shadow: 0 0 25px rgba(255, 85, 208, 0.95), 0 0 50px rgba(255, 0, 200, 0.6);
    margin-bottom: 30px;
    display: inline-block;
    background: #150022;
}

.counter-title {
    font-size: 1.3rem;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 0 10px rgba(255, 85, 208, 0.6);
}

#day-counter {
    font-size: 5rem;
    font-weight: 900;
    color: #ff66df;
    text-shadow: 0 0 25px rgba(255, 85, 208, 0.95), 0 0 60px rgba(255, 0, 200, 0.7);
    font-family: 'Impact', 'Arial Black', sans-serif;
    letter-spacing: 4px;
    margin: 8px 0;
    font-style: italic;
}

/* Interaction Button */
.btn-group-center {
    position: absolute;
    top: 82%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 120;
    pointer-events: auto;
    display: none;
}

button {
    padding: 16px 38px;
    border: 1px solid rgba(255, 85, 208, 0.6);
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(255, 85, 208, 0.95), rgba(160, 0, 240, 0.95));
    color: white;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 85, 208, 0.6);
    backdrop-filter: blur(5px);
    transition: all 0.3s ease-in-out;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 45px rgba(255, 0, 200, 0.9);
}

/* Letter Screen CSS */
.container {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 110;
    pointer-events: none;
}

.surprise-content {
    display: none;
    animation: smoothFadeIn 1.5s ease-out forwards;
}

@keyframes smoothFadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 2.6rem;
    color: #ff66df;
    text-shadow: 0 0 15px rgba(255, 85, 208, 0.8);
}

#secret {
    margin-top: 15px;
    font-size: 1.05rem;
    line-height: 1.8;
    background: rgba(12, 2, 20, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 25px 35px;
    border-radius: 20px;
    border: 1px solid rgba(255, 85, 208, 0.3);
    display: inline-block;
    max-width: 560px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
}

/* Floating Cake Design */
.cake-container {
    display: none; 
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 105;
    text-align: center;
    animation: floatCake 4s ease-in-out infinite alternate;
}

@keyframes floatCake {
    from { transform: translateY(0px) rotate(-1deg); }
    to { transform: translateY(-15px) rotate(2deg); }
}

.cake-text {
    font-size: 1.1rem;
    font-weight: 600;
    color: #fffb00;
    text-shadow: 0 0 10px rgba(255, 251, 0, 0.8);
    margin-top: 5px;
}

.signature {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    letter-spacing: 2px;
    opacity: 0.7;
    z-index: 100;
    text-shadow: 0 0 10px rgba(255, 85, 208, 0.5);
    display: none;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

#yt-player {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
}
</style>
</head>
