<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top, #1a0023, #000);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* Center */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 2;
}

h1 {
    font-size: 2.8rem;
    color: #ff4fd8;
    text-shadow: 0 0 10px #ff4fd8, 0 0 20px #ff00ff;
}

p {
    font-size: 1.2rem;
    opacity: 0.9;
}

/* Button */
button {
    margin-top: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    background: #ff4fd8;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 15px #ff4fd8;
}

/* Hidden message */
#secret {
    display: none;
    margin-top: 20px;
    font-size: 1.1rem;
    color: #fff;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Signature */
.signature {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1rem;
    opacity: 0.8;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4fd8; }
    to { text-shadow: 0 0 20px #ff00ff; }
}

/* Canvas */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
</style>
</head>

<body>

<div class="container">
    <h1>🎉 Happy Birthdayyy Nicole sweetieee !!!! 🎂</h1>
    <p>You deserve all the happiness in the world 💖✨</p>

    <button onclick="revealMessage()">💖 Click for a surprise</button>

    <div id="secret">
        I hope your day is as beautiful as your smile ✨<br>
        Stay happy always 💕 You’re appreciated more than you know.
    </div>

    <br><br>

    <audio id="music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0e7f4c2b6.mp3?filename=romantic-piano-ambient-110397.mp3">
    </audio>

    <button onclick="document.getElementById('music').play()">
        🎵 Play Music
    </button>
</div>

<div class="signature">
    Made with 💖 by Revy 💌
</div>

<canvas id="fireworks"></canvas>

<script>
function revealMessage() {
    document.getElementById("secret").style.display = "block";
}

/* Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

let particles = [];

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 8;
        this.speedY = (Math.random() - 0.5) * 8;
        this.alpha = 1;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function firework() {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height / 2;

    const colors = ["#ff4fd8", "#00ffff", "#ffff00", "#ff6b6b", "#a66bff"];

    for (let i = 0; i < 70; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
    }
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(animate);
}

setInterval(firework, 900);
animate();

window.addEventListener("resize", resize);
</script>

</body>
</html>
