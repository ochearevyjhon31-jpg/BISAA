<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    /* Rich deep space gradient para hindi plain black/white */
    background: radial-gradient(circle at center, #2c003e 0%, #12001a 50%, #05000a 100%);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* Container para sa Text at Buttons */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 10;
    pointer-events: none;
}

.interactive {
    pointer-events: auto;
}

h1 {
    font-size: 2.5rem;
    color: #ff4fd8;
    text-shadow: 0 0 10px #ff4fd8, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
    margin-bottom: 10px;
}

p {
    font-size: 1.2rem;
    opacity: 0.9;
    margin-top: 0;
    margin-bottom: 20px;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
}

/* Image ni Nicole (Siguradong nandoon pa rin!) */
.profile-img {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ff4fd8;
    box-shadow: 0 0 20px #ff4fd8, 0 0 35px #ff00ff;
    margin-bottom: 15px;
}

/* Button Styling */
button {
    margin: 10px 5px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(45deg, #ff4fd8, #b000ff);
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 0 15px #ff4fd8;
    transition: 0.3s ease;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px #ff00ff;
}

#btn-mwa {
    display: none;
}

#secret {
    display: none;
    margin-top: 20px;
    font-size: 1.2rem;
    color: #fff;
    animation: fadeIn 1s ease-in-out;
    line-height: 1.6;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Signature */
.signature {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1rem;
    opacity: 0.8;
    animation: glow 2s infinite alternate;
    z-index: 10;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff4fd8; }
    to { text-shadow: 0 0 20px #ff00ff; }
}

/* Canvas para sa graphics */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

#yt-player {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

/* Screen Glitch Transition effect */
.glitch-flash {
    animation: flashEffect 0.3s ease-out;
}
@keyframes flashEffect {
    0% { filter: invert(1) hue-rotate(90deg); }
    50% { filter: hue-rotate(180deg) contrast(2); }
    100% { filter: none; }
}
</style>
</head>

<body>

<div class="container">
    <div class="interactive">
        <img src="nicole 2.jpg" alt="Nicole" class="profile-img
