<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #1a002c 0%, #0d0013 60%, #030007 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: white;
    letter-spacing: 0.5px;
}

/* Premium Cinematic Intro Screens */
.intro-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    text-align: center;
    width: 90%;
    pointer-events: none;
}

.counter-title {
    font-size: 1.2rem;
    font-style: italic;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 0 10px rgba(255, 102, 223, 0.4);
    margin-bottom: 15px;
    opacity: 0;
    animation: fadeInFadeOut 60s forwards;
}

#day-counter {
    font-size: 3.5rem;
    font-weight: 700;
    color: #ff66df;
    text-shadow: 0 0 20px rgba(255, 102, 223, 0.8), 0 0 40px rgba(255, 0, 255, 0.4);
    font-family: monospace;
    letter-spacing: 2px;
}

@keyframes fadeInFadeOut {
    0% { opacity: 0; transform: translateY(10px); }
    5% { opacity: 1; transform: translateY(0); }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); display: none; }
}

/* Chandeliers Absolute Positioning - Itatago muna sa buong 60s intro */
.chandelier-svg {
    position: absolute;
    top: 0;
    width: 180px;
    height: 130px;
    filter: drop-shadow(0 0 12px rgba(255, 102, 223, 0.6)) drop-shadow(0 0 25px rgba(176, 0, 255, 0.3));
    transform-origin: top center;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    display: none;
}

.left-ch {
    left: 5%;
    animation: gentleSwayLeft 5s ease-in-out infinite alternate;
}

.right-ch {
    right: 5%;
    animation: gentleSwayRight 6s ease-in-out infinite alternate;
}

@keyframes gentleSwayLeft {
    from { transform: rotate(-3deg); }
    to { transform: rotate(3deg); }
}

@keyframes gentleSwayRight {
    from { transform: rotate(3deg); }
    to { transform: rotate(-3deg); }
}

/* Main Container */
.container {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 10;
    pointer-events: none;
}

.interactive {
    pointer-events: auto;
}

.surprise-content {
    display: none;
    animation: smoothFadeIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes smoothFadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

h1 {
    font-size: 2.4rem;
    font-weight: 600;
    color: #ff66df;
    text-shadow: 0 0 15px rgba(255, 102, 223, 0.6), 0 0 30px rgba(255, 0, 255, 0.3);
    margin-bottom: 5px;
}

p.subtitle {
    font-size: 1.1rem;
    opacity: 0.8;
    margin-top: 0;
    margin-bottom: 25px;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    font-style: italic;
}

.profile-img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ff66df;
    box-shadow: 0 0 25px rgba(255, 102, 223, 0.7), 0 0 40px rgba(255, 0, 255, 0.4);
    margin-bottom: 20px;
}

/* Floating Aesthetic Cake */
.cake-container {
    display: none; 
    position: absolute;
    bottom: 90px;
    right: 50px;
    z-index: 12;
    text-align: center;
    animation: floatCake 4s ease-in-out infinite alternate;
}

@keyframes floatCake {
    from { transform: translateY(0px) rotate(-1deg); }
    to { transform: translateY(-12px) rotate(2deg); }
}

.cake-text {
    font-size: 1.15rem;
    font-weight: 500;
    color: #fffb00;
    text-shadow: 0 0 10px rgba(255, 251, 0, 0.6), 0 0 20px rgba(255, 102, 223, 0.5);
    margin-top: 8px;
    letter-spacing: 1px;
    line-height: 1.4;
}

/* Aesthetic Glassmorphism Buttons Control Center */
.btn-group-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    pointer-events: auto;
    display: none; /* Itatago muna hanggang matapos ang 60s intro */
}

button {
    padding: 14px 32px;
    border: 1px solid rgba(255, 102, 223, 0.4);
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(255, 102, 223, 0.8), rgba(176, 0, 255, 0.8));
    color: white;
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 102, 223, 0.4);
    backdrop-filter: blur(4px);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 0, 255, 0.7);
    border-color: rgba(255, 255, 255, 0.6);
}

#btn-mwa {
    display: none;
}

/* Premium Aesthetic Glass Letter Box */
#secret {
    margin-top: 20px;
    font-size: 1.05rem;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.8;
    background: rgba(15, 2, 22, 0.65);
