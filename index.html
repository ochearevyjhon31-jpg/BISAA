<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nicole 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #1a002c 0%, #0d0013 60%, #030007 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: white;
    letter-spacing: 0.5px;
}

/* Big Aesthetic Chandelier Center Top */
.chandelier-svg {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 220px;
    filter: drop-shadow(0 0 15px rgba(255, 102, 223, 0.85)) drop-shadow(0 0 30px rgba(176, 0, 255, 0.5));
    z-index: 5;
    pointer-events: none;
    animation: gentleSway 4s ease-in-out infinite alternate;
}

@keyframes gentleSway {
    from { transform: translateX(-50%) rotate(-1.5deg); }
    to { transform: translateX(-50%) rotate(1.5deg); }
}

/* Main UI Elements Container */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
    z-index: 10;
    pointer-events: none;
}

.profile-img {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 3.5px solid #ff66df;
    box-shadow: 0 0 25px rgba(255, 102, 223, 0.8), 0 0 50px rgba(255, 0, 255, 0.5);
    margin-bottom: 25px;
}

h2.sub-info {
    font-size: 1.25rem;
    font-weight: 400;
    color: #ffffff;
    opacity: 0.9;
    margin: 0;
    font-style: italic;
    text-shadow: 0 0 8px rgba(255, 102, 223, 0.5);
}

.counter-days {
    font-size: 4.8rem;
    font-weight: 700;
    color: #ff66df;
    font-style: italic;
    text-shadow: 0 0 20px rgba(255, 102, 223, 0.9), 0 0 40px rgba(255, 0, 255, 0.6);
    margin: 10px 0;
    letter-spacing: 2px;
}

.beautiful-text {
    font-size: 1.15rem;
    opacity: 0.85;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
}

.signature {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    letter-spacing: 2px;
    opacity: 0.7;
    text-shadow: 0 0 10px rgba(255, 102, 223, 0.5);
    z-index: 10;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

/* Perspective Grid Floor Background Like the Screenshot */
.grid-floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 35vh;
    background-image: 
        linear-gradient(rgba(255, 102, 223, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 102, 223, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    transform: perspective(200px) rotateX(60deg);
    transform-origin: bottom;
    opacity: 0.7;
    z-index: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="grid-floor"></div>

<!-- Neon Chandelier from the Screenshot -->
<svg class="chandelier-svg" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
    <line x1="100" y1="0" x2="100" y2="30" stroke="#ff66df" stroke-width="2.5"/>
    <circle cx="100" cy="30" r="4" fill="#ffccd5"/>
    <path d="M70 45 Q100 60 130 45" stroke="#b000ff" stroke-width="3" fill="none"/>
    <path d="M40 65 Q100 90 160 65" stroke="#ff66df" stroke-width="3.5" fill="none"/>
    <line x1="100" y1="30" x2="100" y2="80" stroke="#ff66df" stroke-width="2"/>
    <path d="M100 30 Q60 40 40 65" stroke="#b000ff" stroke-width="2" fill="none"/>
    <path d="M100 30 Q140 40 160 65" stroke="#b000ff" stroke-width="2" fill="none"/>
    <path d="M40 65 Q100 120 160 65" stroke="#ff66df" stroke-width="2.5" fill="none" stroke-dasharray="2 3"/>
    <circle cx="40" cy="51" r="5" fill="#fff"/>
    <circle cx="70" cy="31" r="5" fill="#fff"/>
    <circle cx="100" cy="83" r="6" fill="#ffff33"/>
    <circle cx="130" cy="31" r="5" fill="#fff"/>
    <circle cx="160" cy="51" r="5" fill="#fff"/>
    <polygon points="100,105 95,113 100,123 105,113" fill="#ff66df"/>
</svg>

<!-- Main UI Section -->
<div class="container">
    <img src="nicole 2.jpg" alt="Nicole" class="profile-img">
    <h2 class="sub-info">Nicole, since June 14, 2006...</h2>
    <div class="counter-days">7305 DAYS</div>
    <div class="beautiful-text">of beautiful moments with you... ✨</div>
</div>

<div class="signature">
    MADE WITH 💖 BY REVY 💌
</div>

<canvas id="mainCanvas"></canvas>

<script>
const canvas = document.getElementById("mainCanvas");
const ctx = canvas.getContext("2d");

let branches = [];
let flowers = [];
let particles = [];
let fallingHearts = [];
let stars = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Starfield Background
for(let i = 0; i < 60; i++) {
    stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight * 0.7,
        size: Math.random() * 1.5,
        alpha: Math.random() * 0.8 + 0.2
    });
}

// INSTANT GENERATION ON LOAD
function init() {
    // Gumawa agad ng Mataba at Malaking Puno sa gitna sa ilalim
    createBranch(canvas.width / 2, canvas.height, -Math.PI / 2, 11, 14, "#2a1102");
    
    // Simulan agad ang sabog ng mga dambuhalang Japanese Fireworks at Puso
    setInterval(createJapaneseFirework, 600);
    setInterval(createHeartPetal, 40);
}

function createBranch(startX, startY, angle, length, thickness, color) {
    branches.push({
        startX, startY,
        endX: startX, endY: startY,
        targetX: startX + Math.cos(angle) * length * 11,
        targetY: startY + Math.sin(angle) * length * 11,
        angle, length, thickness, color,
        currentProgress: 0,
        childGenerated: false
    });
}

class FireworkParticle {
    constructor(x, y, color, speedMultiplier) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2.5 + 1.2;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 7 + 3) * speedMultiplier; 
        this.speedX = Math.cos(angle) * speed;
        this.speedY = Math.sin(angle) * speed;
        this.gravity = 0.04;
        this.alpha = 1;
        this.decay = Math.random() * 0.01 + 0.008;
    }
    update() {
        this.speedY += this.gravity;
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
    }
}

// MALALAKING JAPANESE FIREWORKS (SABOG SA GILID AT TAAS KATULAD NG SCREENSHOT)
function createJapaneseFirework() {
    // Nagpapalit-palit sa kaliwa, kanan, at bandang itaas
    const positions = [
        { x: canvas.width * 0.20, y: canvas.height * 0.35 },
        { x: canvas.width * 0.80, y: canvas.height * 0.40 },
        { x: canvas.width * 0.35, y: canvas.height * 0.25 },
        { x: canvas.width * 0.65, y: canvas.height * 0.30 }
    ];
    
    const target = positions[Math.floor(Math.random() * positions.length)];
    const colors = ["#ff66df", "#00ffff", "#ffff55", "#ff3366", "#b000ff", "#ff99bb"];
    const fireworkColor = colors[Math.floor(Math.random() * colors.length)];
    
    // 75 Particles para talagang dambuhala at siksik ang bilog ng sabog
    for (let i = 0; i < 75; i++) {
        particles.push(new FireworkParticle(target.x, target.y, fireworkColor, 1.3));
    }
}

// HUGIS PUSONG MGA PETALS MULA SA SCREENSHOT
function createHeartPetal() {
    if (fallingHearts.length < 180) {
        fallingHearts.push({
            x: Math.random() * canvas.width,
            y: -10,
            speedX: Math.random() * 2 - 1,
            speedY: Math.random() * 1.5 + 1.5,
            size: Math.random() * 6 + 6,
            opacity: Math.random() * 0.7 + 0.3,
            rotation: Math.random() * Math.PI,
            rotSpeed: Math.random() * 0.02 - 0.01
        });
    }
}

function drawHeart(x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y + size / 4);
    ctx.quadraticCurveTo(x, y, x + size / 2, y);
    ctx.quadraticCurveTo(x + size, y, x + size, y + size / 3);
    ctx.quadraticCurveTo(x + size, y + size * 2 / 3, x + size / 2, y + size);
    ctx.quadraticCurveTo(x, y + size * 2 / 3, x, y + size / 3);
    ctx.quadraticCurveTo(x, y, x, y + size / 4);
    ctx.closePath();
}

function animate() {
    // Fade background smoothly para may trails ang fireworks
    ctx.fillStyle = "rgba(10, 0, 16, 0.25)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Stars
    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
    stars.forEach(s => {
        ctx.globalAlpha = s.alpha + Math.sin(Date.now() * 0.005 + s.x) * 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;

    // Grow Tree Branches
    branches.forEach(b => {
        if (b.currentProgress < 1) {
            b.currentProgress += 0.025;
            b.endX = b.startX + (b.targetX - b.startX) * b.currentProgress;
            b.endY = b.startY + (b.targetY - b.startY) * b.currentProgress;
        }

        ctx.beginPath();
        ctx.moveTo(b.startX, b.startY);
        ctx.lineTo(b.endX, b.endY);
        ctx.lineWidth = b.thickness;
        ctx.strokeStyle = b.color;
        ctx.lineCap = "round";
        ctx.stroke();

        if (b.currentProgress >= 1 && !b.childGenerated) {
            b.childGenerated = true;
            if (b.length > 2.5) {
                createBranch(b.endX, b.endY, b.angle - 0.42 + (Math.random() * 0.1), b.length * 0.78, b.thickness * 0.7, b.color);
                createBranch(b.endX, b.endY, b.angle + 0.42 - (Math.random() * 0.1), b.length * 0.78, b.thickness * 0.7, b.color);
            } else {
                // Punuin ng hugis pusong bulaklak ang mga dulo ng sanga
                for (let i = 0; i < 5; i++) {
                    flowers.push({
                        x: b.endX + (Math.random() * 30 - 15),
                        y: b.endY + (Math.random() * 30 - 15),
                        size: 0,
                        maxSize: Math.random() * 8 + 6,
                        color: ["#ffccd5", "#ff66df", "#ff3366", "#ff80ab"][Math.floor(Math.random() * 4)]
                    });
                }
            }
        }
    });

    // Draw Heart Flowers on Tree
    flowers.forEach(f => {
        if (f.size < f.maxSize) f.size += 0.2;
        ctx.save();
        ctx.fillStyle = f.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = f.color;
        drawHeart(f.x - f.size/2, f.y - f.size/2, f.size);
        ctx.fill();
        ctx.restore();
    });

    // Update & Draw Fireworks Particles
    particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
    });

    // Update & Draw Falling Heart Leaves
    fallingHearts.forEach((heart, i) => {
        heart.y += heart.speedY;
        heart.x += Math.sin(Date.now() * 0.003 + heart.x) * 0.8;
        heart.rotation += heart.rotSpeed;

        ctx.save();
        ctx.translate(heart.x, heart.y);
        ctx.rotate(heart.rotation);
        ctx.fillStyle = "#ff66df";
        ctx.globalAlpha = heart.opacity;
        drawHeart(-heart.size / 2, -heart.size / 2, heart.size);
        ctx.fill();
        ctx.restore();

        if (heart.y > canvas.height) fallingHearts.splice(i, 1);
    });

    ctx.globalAlpha = 1.0;
    requestAnimationFrame(animate);
}

// Start everything smoothly
window.onload = () => {
    init();
    animate();
};
</script>

</body>
</html>
